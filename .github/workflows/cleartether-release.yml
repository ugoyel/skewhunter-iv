name: ClearTether release

# Builds a signed App Bundle and uploads it to Google Play. Run manually from the Actions tab.
# Needs the secrets listed in ClearTether/docs/play-store/PUBLISHING.md (section 7).
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClearTether
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.CLEARTETHER_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Test and build signed bundle
        env:
          CLEARTETHER_KEYSTORE: ${{ runner.temp }}/upload.jks
          CLEARTETHER_KEYSTORE_PASSWORD: ${{ secrets.CLEARTETHER_KEYSTORE_PASSWORD }}
          CLEARTETHER_KEY_ALIAS: ${{ secrets.CLEARTETHER_KEY_ALIAS }}
          CLEARTETHER_KEY_PASSWORD: ${{ secrets.CLEARTETHER_KEY_PASSWORD }}
          PLAY_LICENSE_KEY: ${{ secrets.CLEARTETHER_PLAY_LICENSE_KEY }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:bundleRelease \
            -PversionCode=$((100 + ${{ github.run_number }})) \
            -PCLEARTETHER_PLAY_LICENSE_KEY="$PLAY_LICENSE_KEY"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cleartether.app
          releaseFiles: ClearTether/app/build/outputs/bundle/release/app-release.aab
          mappingFile: ClearTether/app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track }}
          status: ${{ inputs.track == 'production' && 'draft' || 'completed' }}

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: cleartether-release-aab
          path: ClearTether/app/build/outputs/bundle/release/app-release.aab
