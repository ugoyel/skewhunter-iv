name: Hearby

# Builds and tests the Hearby audio-sharing apps under hearby/.
# Only runs when something under hearby/ (or this file) changes.
on:
  push:
    paths:
      - "hearby/**"
      - ".github/workflows/hearby.yml"
  pull_request:
    paths:
      - "hearby/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearby-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests, lint, debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearby/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hearby-debug-apk
          path: hearby/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (core tests, simulator build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: hearby/ios
    steps:
      - uses: actions/checkout@v4
      - name: Sync core unit tests (same vectors and simulations as Android)
        run: swift test
      - name: Build the app for the iOS Simulator
        run: |
          xcodebuild -project Hearby.xcodeproj -scheme Hearby -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
