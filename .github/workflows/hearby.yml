name: Hearby

# Builds and tests the Hearby Android app (and the Safari guest page it serves) under hearby/.
# Only runs when something under hearby/ (or this file) changes. The iPhone app has its own
# workflow, hearby-ios.yml, because macOS minutes cost ten times as much on private repositories.
on:
  push:
    paths:
      - "hearby/**"
      - ".github/workflows/hearby.yml"
  pull_request:
    paths:
      - "hearby/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearby-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests, screenshots, lint, debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearby/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Safari guest page logic (Node)
        run: node --test app/src/test/js/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hearby-debug-apk
          path: hearby/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hearby-android-screens
          path: hearby/android/app/build/outputs/roborazzi
          if-no-files-found: error
