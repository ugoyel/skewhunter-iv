name: Hearby

# Builds and tests the Hearby audio-sharing apps under hearby/.
# Only runs when something under hearby/ (or this file) changes.
on:
  push:
    paths:
      - "hearby/**"
      - ".github/workflows/hearby.yml"
  pull_request:
    paths:
      - "hearby/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearby-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests, screenshots, lint, debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearby/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hearby-debug-apk
          path: hearby/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hearby-android-screens
          path: hearby/android/app/build/outputs/roborazzi
          if-no-files-found: error

  ios:
    name: iOS (core tests, simulator build, screenshots)
    runs-on: macos-15
    permissions:
      contents: write   # TEMPORARY: lets this one run commit its simulator screenshots back to the branch
    defaults:
      run:
        working-directory: hearby/ios
    steps:
      - uses: actions/checkout@v4
      - name: Sync core unit tests (same vectors and simulations as Android)
        run: swift test
      - name: Build the app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project Hearby.xcodeproj -scheme Hearby -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -25
      - name: Screenshots of every screen (demo data, in the simulator)
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/Hearby.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in runtimes for d in devices[k] if d['name'].startswith('iPhone')))")
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screens
          for screen in join playing syncing ended; do
            xcrun simctl launch "$UDID" io.github.ugoyel.hearby -demo "$screen"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screens/ios_$screen.png"
            xcrun simctl terminate "$UDID" io.github.ugoyel.hearby || true
          done
          sips -Z 1100 screens/*.png > /dev/null
          ls -la screens
      - uses: actions/upload-artifact@v4
        with:
          name: hearby-ios-screens
          path: hearby/ios/screens
          if-no-files-found: error
      - name: Commit the screenshots to the branch (temporary step)
        run: |
          mkdir -p ../docs/screens
          cp screens/*.png ../docs/screens/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../docs/screens
          git commit -m "Hearby: iOS simulator screenshots [skip ci]"
          git push
