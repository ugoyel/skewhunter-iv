name: Skew Hunter — IV + Paper Trader

on:
  schedule:
    - cron: '*/3 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas plotly pytz

      - name: Collect IV data
        run: python collector.py

      - name: Run paper trader
        run: python paper_trade.py

      - name: Build chart
        run: python chart.py

      - name: Build mobile app feed
        run: python app_data.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in iv_data.csv trades.csv trade_state.json index.html app_data.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
