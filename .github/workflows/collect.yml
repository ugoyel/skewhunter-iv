name: Skew Hunter IV Collector

on:
  schedule:
    # Every 3 minutes Mon–Fri 9:15 AM to 3:30 PM IST
    # IST = UTC+5:30, so 9:15 IST = 3:45 UTC, 15:30 IST = 10:00 UTC
    - cron: '*/3 3-10 * * 1-5'
  workflow_dispatch:   # Manual trigger button

jobs:
  collect-and-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas plotly pytz

      - name: Collect IV data
        run: python collector.py

      - name: Build chart
        run: python chart.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iv_data.csv index.html
          git diff --staged --quiet || git commit -m "IV update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
