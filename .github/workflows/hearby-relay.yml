name: Hearby relay

# Puts the internet relay (hearby/relay) on your free Cloudflare account, so phones on other networks
# can join YouTube parties. Run it by hand: Actions › Hearby relay › Run workflow. It needs two
# repository secrets (Settings › Secrets and variables › Actions): CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. See hearby/relay/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearby-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy the relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearby/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test test/*.test.mjs
      - name: The guest page, from the app
        run: mkdir -p public && cp ../android/app/src/main/assets/web/* public/
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first (see hearby/relay/README.md)."
            exit 1
          fi
          npx --yes wrangler@4.150.0 deploy | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          echo "### Relay is live: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Send this address to whoever builds the app (hearby.relayUrl)." >> "$GITHUB_STEP_SUMMARY"
