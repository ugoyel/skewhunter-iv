name: PTT Radio APK

on:
  push:
    paths:
      - "walkie-talkie/**"
      - ".github/workflows/walkie-talkie-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a public download

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walkie-talkie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build APK and Play Store bundle
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ptt-radio-apk
          path: walkie-talkie/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ptt-radio-play-bundle
          path: walkie-talkie/app/build/outputs/bundle/release/*.aab
      - name: Name the files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ZeroBar.apk
          cp app/build/outputs/bundle/release/*.aab dist/ZeroBar.aab
      # One fixed public link, updated on every build: no GitHub sign-in needed, works on a phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: zerobar-latest
          name: ZeroBar (latest test build)
          prerelease: true
          body: |
            Latest test build of ZeroBar, built from commit ${{ github.sha }}.
            On your phone: tap ZeroBar.apk to download, then open it to install.
            ZeroBar.aab is the file for Google Play Console.
          files: |
            walkie-talkie/dist/ZeroBar.apk
            walkie-talkie/dist/ZeroBar.aab
