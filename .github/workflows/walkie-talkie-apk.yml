name: PTT Radio APK

on:
  push:
    paths:
      - "walkie-talkie/**"
      - ".github/workflows/walkie-talkie-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walkie-talkie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ptt-radio-apk
          path: walkie-talkie/app/build/outputs/apk/release/*.apk
