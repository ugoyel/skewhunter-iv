# Hearby relay: lets phones on different networks join a YouTube party.
# Deployed by .github/workflows/hearby-relay.yml (see README.md here); free Cloudflare plan.
name = "hearby-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The guest page (copied from the Android app's assets by the deploy workflow).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "PARTY"
class_name = "Party"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Party"]
